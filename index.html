<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="app-wrapper">

      <!-- Header / Balance -->
      <header class="header">
        <h1 class="app-title">💰 Budget Tracker</h1>
        <div class="balance-card">
          <span class="balance-label">Total Spent</span>
          <span class="balance-amount" id="totalBalance">Rp 0</span>
        </div>
      </header>

      <!-- Add Transaction Form -->
      <section class="card form-section">
        <h2 class="section-title">Add Transaction</h2>
        <form id="transactionForm" novalidate>
          <div class="form-group">
            <label for="itemName">Item Name</label>
            <input
              type="text"
              id="itemName"
              placeholder="e.g. Lunch, Grab, Cinema"
              autocomplete="off"
            />
            <span class="error-msg" id="nameError">Please enter an item name.</span>
          </div>

          <div class="form-group">
            <label for="amount">Amount (Rp)</label>
            <input
              type="number"
              id="amount"
              placeholder="e.g. 25000"
              min="1"
            />
            <span class="error-msg" id="amountError">Please enter a valid amount.</span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="">-- Select Category --</option>
              <option value="Food">🍔 Food</option>
              <option value="Transport">🚗 Transport</option>
              <option value="Fun">🎉 Fun</option>
            </select>
            <span class="error-msg" id="categoryError">Please select a category.</span>
          </div>

          <button type="submit" class="btn-add">+ Add Transaction</button>
        </form>
      </section>

      <!-- Chart -->
      <section class="card chart-section">
        <h2 class="section-title">Spending by Category</h2>
        <div class="chart-container">
          <canvas id="spendingChart"></canvas>
          <p class="chart-empty" id="chartEmpty">No transactions yet. Add one above!</p>
        </div>
      </section>

      <!-- Transaction List -->
      <section class="card list-section">
        <h2 class="section-title">Transaction History</h2>
        <ul class="transaction-list" id="transactionList">
          <li class="list-empty" id="listEmpty">No transactions yet.</li>
        </ul>
      </section>

    </div>

    <script src="js/app.js"></script>
  </body>
</html>
